<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open IC Creator</title>
<link rel="stylesheet" href="css/openic.css">
<link rel="stylesheet" href="css/openic-icons.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; }
</style>
</head>
<body>
<!-- OPENIC:BODY:START -->
<div id="openic-root">
  <div class="oic-top">
    <span class="oic-brand">Open IC Creator</span>
    <span class="oic-mode" id="openic-mode"></span>
    <span class="oic-file"><span id="openic-kind" class="oic-badge">no file</span><span id="openic-name"></span><span id="openic-dirty" class="oic-dirty"></span></span>
    <span class="oic-ext" id="openic-ext"></span>
  </div>
  <div class="oic-bar">
    <button class="oic-btn" data-oic="new-zone" title="A new OgreBot zone file: the steps the instance controller runs">New zone file</button>
    <button class="oic-btn" data-oic="new-fight" title="A new OgreBot fight file: what the group does during one named's fight">New fight file</button>
    <button class="oic-btn" data-oic="open" title="Open a zone file, a fight file or an ISXJQB instance file">Open...</button>
    <button class="oic-btn oic-primary" data-oic="save" title="Save (Ctrl+S)">Save</button>
    <button class="oic-btn" data-oic="save-as" title="Save under another name">Save as...</button>
    <span class="oic-sep"></span>
    <span class="oic-seg" id="openic-views"><span data-oic-view="flow" title="The file as a flowchart: drag boxes onto a + to move them">Flowchart</span><span data-oic-view="words" title="Every step in plain words">Words</span><span data-oic-view="json" title="The whole file as text">JSON</span><span data-oic-view="map" title="Every spot the file names, seen from above">Spots</span></span>
    <span class="oic-sep"></span>
    <button class="oic-btn" id="openic-undo" data-oic="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="oic-btn" id="openic-redo" data-oic="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button class="oic-btn" id="openic-checkbtn" data-oic="check" title="Check the file now; the list is under the chart">Check</button>
    <span class="oic-sep"></span>
    <button class="oic-btn" data-oic="game" title="Reload in Ogre, run this zone file, and the ISXJQB and ISXADD extras">In game &#9662;</button>
    <button class="oic-btn" id="openic-classbtn" data-oic="class" title="Your class and your group: your abilities show their own icons, another class shows its class icon">Class: any</button>
  </div>
  <div class="oic-main">
    <div class="oic-left">
      <div class="oic-view" id="openic-v-flow"><div id="openic-flow" style="width:100%;height:100%;"></div></div>
      <div class="oic-view" id="openic-v-words" style="display:none;"><div id="openic-words"></div></div>
      <div class="oic-view" id="openic-v-json" style="display:none;">
        <textarea id="openic-json" spellcheck="false"></textarea>
        <div class="oic-row"><button class="oic-btn oic-primary" data-oic="json-apply">Apply</button><button class="oic-btn" data-oic="json-revert">Revert</button><span id="openic-json-msg" class="oic-note"></span></div>
      </div>
      <div class="oic-view" id="openic-v-map" style="display:none;"><svg id="openic-map" xmlns="http://www.w3.org/2000/svg"></svg><div id="openic-map-note" class="oic-note"></div></div>
    </div>
    <div class="oic-side" id="openic-side"></div>
  </div>
  <div class="oic-bottom">
    <div id="openic-problems"></div>
    <div id="openic-linebox" style="display:none;"><div class="oic-h">Console lines <span class="oic-x" data-oic="lines-clear">clear</span></div><div id="openic-lines"></div></div>
    <pre id="openic-selftest"></pre>
  </div>
  <div class="oic-menu" id="openic-menu"></div>
  <div class="oic-modal" id="openic-modal">
    <div class="oic-dialog">
      <div class="oic-dt" id="openic-modal-title"></div>
      <div class="oic-dm" id="openic-modal-msg"></div>
      <input type="text" id="openic-modal-input" spellcheck="false">
      <div class="oic-row" style="justify-content:flex-end;">
        <button class="oic-btn" id="openic-modal-cancel" data-oic="modal-cancel">Cancel</button>
        <button class="oic-btn oic-primary" id="openic-modal-ok" data-oic="modal-ok">OK</button>
      </div>
    </div>
  </div>
  <input type="file" id="openic-file" accept=".json,application/json" style="display:none;">
  <div style="display:none;">
    <input type="hidden" id="openic-arg-kind"><input type="hidden" id="openic-arg-path"><input type="hidden" id="openic-arg-named">
    <input type="hidden" id="openic-arg-zone"><input type="hidden" id="openic-arg-variant"><input type="hidden" id="openic-arg-loc"><input type="hidden" id="openic-arg-b64">
    <textarea id="openic-arg-text"></textarea>
    <input type="hidden" id="openic-msg-ext"><input type="hidden" id="openic-msg-me"><input type="hidden" id="openic-msg-say">
    <input type="hidden" id="openic-msg-route"><textarea id="openic-msg-check"></textarea><textarea id="openic-msg-file"></textarea>
  </div>
</div>
<!-- OPENIC:BODY:END -->
<!-- OPENIC:SCRIPTS:START -->
<script src="js/openic-host.js"></script>
<script src="js/ic-registry.js"></script>
<script src="js/ic-steps-move.js"></script>
<script src="js/ic-steps-fight.js"></script>
<script src="js/ic-steps-wait.js"></script>
<script src="js/ic-pack.js"></script>
<script src="js/ic-model.js"></script>
<script src="js/ic-validate.js"></script>
<script src="js/ic-words.js"></script>
<script src="js/ic-icons.js"></script>
<script src="js/ic-oc-picker.js"></script>
<script src="js/ic-flowview.js"></script>
<script src="js/ic-flowparts.js"></script>
<script src="js/ic-flow.js"></script>
<script src="js/ic-ogf-words.js"></script>
<script src="js/ic-ogfight-flow.js"></script>
<script src="js/ic-snippets.js"></script>
<script src="js/ic-import.js"></script>
<script src="js/ic-flowpal.js"></script>
<script src="js/ic-nmap.js"></script>
<script src="js/ic-nmap-enc.js"></script>
<script src="js/openic-vocab.js"></script>
<script src="js/openic-zone.js"></script>
<script src="js/openic-app.js"></script>
<script src="js/openic-icons.js"></script>
<script src="js/openic-game.js"></script>
<script src="data/spell-icons.js"></script>
<script src="data/item-icons.js"></script>
<script src="js/openic-selftest.js"></script>
<!-- OPENIC:SCRIPTS:END -->
<script>
  window.IC.app.start();
</script>
</body>
</html>
